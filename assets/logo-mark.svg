<svg viewBox="218 122 770 620" xmlns="http://www.w3.org/2000/svg">
<style>
/* 三层动作，周期互质(6.8/8.5/11s)避免机械感：
   眨眼(单/单/双) → 眼睛左右看 → 偶尔歪头 */
.eye { transform-box: fill-box; transform-origin: center; animation: bm-blink 6.8s linear infinite; }
@keyframes bm-blink {
  0%, 17% { transform: scaleY(1); }
  19% { transform: scaleY(0.06); }
  21%, 50% { transform: scaleY(1); }
  52% { transform: scaleY(0.06); }
  54%, 82% { transform: scaleY(1); }
  84% { transform: scaleY(0.06); }
  86% { transform: scaleY(1); }
  88% { transform: scaleY(0.06); }
  90%, 100% { transform: scaleY(1); }
}
.eyes { transform-box: fill-box; transform-origin: center; animation: bm-look 8.5s ease-in-out infinite; }
@keyframes bm-look {
  0%, 24% { transform: translateX(0); }
  30%, 42% { transform: translateX(-24px); }
  48%, 66% { transform: translateX(0); }
  72%, 84% { transform: translateX(24px); }
  90%, 100% { transform: translateX(0); }
}
.head { transform-box: fill-box; transform-origin: 50% 78%; animation: bm-tilt 11s ease-in-out infinite; }
@keyframes bm-tilt {
  0%, 55% { transform: rotate(0deg); }
  61%, 71% { transform: rotate(-2.4deg); }
  77%, 100% { transform: rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) { .eye, .eyes, .head { animation: none; } }
</style>
